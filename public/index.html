<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grounded Q&amp;A</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>Grounded Q&amp;A</h1>
    <p class="site-tagline">
      Answers come only from the documents on the shelf — the built-in FAQ and any PDFs added below —
      and every answer shows exactly where it came from.
    </p>
  </header>

  <div class="layout">
    <main class="pass">
      <section class="ask" aria-labelledby="ask-heading">
        <h2 id="ask-heading" class="visually-hidden">Ask a question</h2>

        <form id="ask-form" class="ask-form" novalidate>
          <label for="question-input">Your question</label>
          <textarea
            id="question-input"
            name="question"
            rows="2"
            maxlength="500"
            placeholder="e.g. What are your hours on Sunday?"
            required
          ></textarea>
          <div class="ask-form-footer">
            <span id="char-counter" class="char-counter" aria-live="polite"></span>
            <button type="submit" id="ask-button" class="ask-button">Ask</button>
          </div>
        </form>

        <p id="ask-error" class="ask-error" role="alert"></p>

        <h3 class="visually-hidden">Example questions</h3>
        <ul class="example-list">
          <li><button type="button" class="example-question">When are you closed?</button></li>
          <li><button type="button" class="example-question">Can I reserve a table for 4 people?</button></li>
          <li><button type="button" class="example-question">Do you deliver, and what is the minimum order?</button></li>
          <li><button type="button" class="example-question">Is there vegan food at Playa Lechi?</button></li>
          <li><button type="button" class="example-question">What is the capital of France?</button></li>
        </ul>
      </section>

      <section class="rail" aria-label="Current ticket" aria-live="polite" aria-atomic="true">
        <div class="rail-bar" aria-hidden="true"></div>
        <div class="ticket-slot"></div>
      </section>

      <details class="retrieved-details">
        <summary>Retrieved passages (0)</summary>
        <table class="retrieved-table">
          <thead>
            <tr>
              <th scope="col">Rank</th>
              <th scope="col">Source</th>
              <th scope="col">Location</th>
              <th scope="col">Score</th>
            </tr>
          </thead>
          <tbody id="retrieved-body"></tbody>
        </table>
      </details>
    </main>

    <aside class="shelf" aria-labelledby="shelf-heading">
      <h2 id="shelf-heading">Documents</h2>
      <button type="button" id="add-pdf-button" class="add-pdf-button">Add a PDF</button>
      <input
        type="file"
        id="pdf-input"
        class="visually-hidden"
        accept="application/pdf,.pdf"
        aria-label="Choose a PDF file to add to the shelf"
      />
      <p id="upload-status" class="upload-status" role="status"></p>
      <ul id="document-list" class="document-list"></ul>
    </aside>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
