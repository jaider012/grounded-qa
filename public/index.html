<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grounded Q&amp;A</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <div class="sidebar">
      <header class="sidebar-header">
        <h1 class="wordmark">Grounded Q&amp;A</h1>
        <p class="sidebar-tagline">Answers come only from these documents.</p>
      </header>

      <section class="documents" aria-labelledby="documents-heading">
        <h2 id="documents-heading">Documents</h2>
        <ul id="document-list" class="document-list"></ul>
        <p id="admin-note" class="admin-note"></p>
        <button type="button" id="add-pdf-button" class="add-pdf-button">Add a PDF</button>
        <input
          type="file"
          id="pdf-input"
          class="visually-hidden"
          tabindex="-1"
          accept="application/pdf,.pdf"
          aria-label="Choose a PDF file to add"
        />
        <p id="upload-status" class="upload-status" role="status"></p>
      </section>

      <div id="account-block" class="account-block"></div>
    </div>

    <main class="main">
      <section class="ask" aria-labelledby="ask-heading">
        <h2 id="ask-heading" class="visually-hidden">Ask a question</h2>

        <form id="ask-form" class="ask-form" novalidate>
          <label for="question-input">Your question</label>
          <textarea
            id="question-input"
            name="question"
            rows="2"
            maxlength="500"
            placeholder="e.g. What are your hours on Sunday?"
            required
          ></textarea>
          <div class="ask-form-footer">
            <span id="char-counter" class="char-counter" aria-live="polite"></span>
            <button type="submit" id="ask-button" class="ask-button">Ask</button>
          </div>
        </form>

        <p id="ask-error" class="ask-error" role="alert"></p>

        <h3 class="visually-hidden">Example questions</h3>
        <ul class="example-list">
          <li><button type="button" class="example-question">When are you closed?</button></li>
          <li><button type="button" class="example-question">Can I reserve a table for 4 people?</button></li>
          <li><button type="button" class="example-question">Do you deliver, and what is the minimum order?</button></li>
          <li><button type="button" class="example-question">Is there vegan food at Playa Lechi?</button></li>
          <li><button type="button" class="example-question">What is the capital of France?</button></li>
        </ul>
      </section>

      <section id="answers" class="answers" aria-label="Answers" aria-live="polite"></section>
    </main>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
